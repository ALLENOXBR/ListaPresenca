<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Classe Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff', 100: '#e0effe', 200: '#bae0fd', 300: '#7cc7fb',
                            400: '#36acf7', 500: '#0c92eb', 600: '#0074c7', 700: '#015da1',
                            800: '#065085', 900: '#0b426e',
                        },
                        present: '#22c55e',
                        absent: '#ef4444',
                        justified: '#f59e0b',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { scroll-behavior: smooth; font-family: 'Inter', sans-serif; }
        .status-btn-active { transform: scale(1.1); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/90 dark:bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center z-[100] transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="font-medium animate-pulse text-slate-600 dark:text-slate-400">Sincronizando com a nuvem...</p>
    </div>

    <!-- Login/Register Screen -->
    <div id="auth-screen" class="hidden fixed inset-0 z-[80] bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-4">
        <div class="w-full max-w-md space-y-8 bg-white dark:bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-800">
            <div class="text-center space-y-2">
                <div class="inline-flex bg-brand-600 p-3 rounded-2xl text-white mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v14.4a2.5 2.5 0 0 0-2.5 2.5H4Z"/><path d="M6 19.5V22.5h10.5a2.5 2.5 0 0 0 2.5-2.5H6Z"/></svg>
                </div>
                <h2 id="auth-title" class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Aceder ao Diário</h2>
                <p id="auth-subtitle" class="text-slate-500 dark:text-slate-400 text-sm">Introduza as suas credenciais para continuar.</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">E-mail</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:border-brand-500 outline-none transition-all" placeholder="professor@escola.pt">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Palavra-passe</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:border-brand-500 outline-none transition-all" placeholder="••••••••">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full py-4 bg-brand-600 text-white rounded-xl font-black shadow-lg shadow-brand-500/20 hover:bg-brand-700 active:scale-95 transition-all mt-4">Entrar</button>
            </form>

            <div class="text-center pt-4">
                <button id="toggle-auth-mode" class="text-sm font-bold text-brand-600 dark:text-brand-400 hover:underline">Não tem conta? Crie uma agora</button>
            </div>
        </div>
    </div>

    <!-- Main Content (App) -->
    <div id="app-content" class="hidden">
        <nav class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3">
                        <div class="bg-brand-600 p-2 rounded-lg text-white">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v14.4a2.5 2.5 0 0 0-2.5 2.5H4Z"/><path d="M6 19.5V22.5h10.5a2.5 2.5 0 0 0 2.5-2.5H6Z"/></svg>
                        </div>
                        <span class="text-lg font-black tracking-tighter hidden sm:block">DIÁRIO PRO</span>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <button id="theme-toggle" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-500">
                            <svg id="sun-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                        </button>
                        <button onclick="handleLogout()" class="p-2 rounded-lg hover:bg-red-50 text-slate-400 hover:text-red-500 transition-all" title="Sair">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                <div class="space-y-2">
                    <div class="flex items-center gap-3">
                        <h1 id="active-class-title" class="text-3xl font-black tracking-tight">Carregando...</h1>
                        <button onclick="document.getElementById('modal-manage-classes').classList.remove('hidden')" class="p-2 rounded-xl text-slate-400 hover:text-brand-600 hover:bg-brand-50 transition-all border border-transparent">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 18 2 2 4-4"/><path d="M12 21H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v7"/><path d="M2 10h20"/></svg>
                        </button>
                    </div>
                    <div class="flex flex-wrap items-center gap-4 text-sm font-bold">
                        <input type="date" id="current-date" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-brand-600 font-bold focus:ring-0 outline-none cursor-pointer">
                        <div id="stats-summary" class="flex gap-4 bg-white dark:bg-slate-900 px-4 py-2 rounded-lg border border-slate-200 shadow-sm">
                            <span class="text-present">P: <span id="stat-p">0</span></span>
                            <span class="text-absent">F: <span id="stat-f">0</span></span>
                            <span class="text-justified">J: <span id="stat-j">0</span></span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2 no-print">
                    <button onclick="markAll('P')" class="px-5 py-2.5 bg-present text-white rounded-xl font-bold shadow-lg shadow-present/20 hover:scale-[1.02] active:scale-95 transition-all text-sm flex items-center gap-2">
                        Presença Geral
                    </button>
                    <button id="btn-export" class="px-5 py-2.5 bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-xl font-bold transition-all text-sm">
                        PDF
                    </button>
                    <button onclick="openCharts()" class="p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-600 hover:text-brand-500 transition-all">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
                    </button>
                </div>
            </div>

            <div class="grid lg:grid-cols-4 gap-8">
                <div class="lg:col-span-3">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                        <div class="p-4 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-700">
                            <input type="text" id="search-students" placeholder="Filtrar alunos..." class="bg-transparent border-none text-sm w-full focus:ring-0">
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="text-slate-400 text-[10px] uppercase font-black tracking-widest border-b border-slate-50 dark:border-slate-800">
                                    <tr>
                                        <th class="px-6 py-4 w-16 text-center">#</th>
                                        <th class="px-6 py-4">Aluno</th>
                                        <th class="px-6 py-4 text-center w-48">Presença</th>
                                        <th class="px-6 py-4 text-right no-print w-24">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="students-table-body" class="divide-y divide-slate-50 dark:divide-slate-800/50"></tbody>
                            </table>
                            <div id="empty-state" class="hidden py-20 text-center text-slate-400">
                                <p class="font-bold">Nenhum aluno registado nesta turma.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-6 no-print">
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Novo Aluno</h3>
                        <div class="space-y-3">
                            <input type="text" id="new-student-name" placeholder="Nome Completo" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none text-sm font-bold">
                            <button onclick="addStudent()" class="w-full py-3 bg-brand-600 text-white rounded-xl font-black shadow-lg shadow-brand-500/20 active:scale-95 transition-all">Adicionar</button>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Opções</h3>
                        <div class="space-y-2">
                            <button onclick="importList()" class="w-full px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition-all text-left">Importar Lista</button>
                            <button onclick="clearDailyRecords()" class="w-full px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold hover:bg-red-50 text-red-500 transition-all text-left">Limpar Hoje</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Manage Classes -->
    <div id="modal-manage-classes" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
                <h3 class="text-xl font-black">Turmas</h3>
                <button onclick="document.getElementById('modal-manage-classes').classList.add('hidden')" class="p-2 hover:bg-slate-100 rounded-full">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="new-class-name" placeholder="Nome da turma..." class="flex-1 px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none text-sm font-bold">
                    <button onclick="addClass()" class="px-5 bg-brand-600 text-white rounded-xl font-black">+</button>
                </div>
                <div id="classes-list" class="space-y-2 max-h-72 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- Modal: Charts -->
    <div id="modal-charts" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black">Estatísticas</h3>
                <button onclick="document.getElementById('modal-charts').classList.add('hidden')" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="w-full aspect-square max-w-[250px] mx-auto mb-6">
                <canvas id="attendanceChart"></canvas>
            </div>
            <div id="chart-legend" class="grid grid-cols-3 gap-2 text-center text-[10px] font-black uppercase tracking-widest text-slate-400"></div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-8 right-8 z-[100] flex flex-col gap-3"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuração Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'diary-pro-validated';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let activeClassId = null;
        let state = { classes: [] };
        let attendanceChart = null;
        let isLoginMode = true;

        // --- AUTH LOGIC (Rule 3) ---
        const initAuth = async () => {
            // Prioridade ao token do sistema, depois ouvimos o estado
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try { await signInWithCustomToken(auth, __initial_auth_token); } catch(e) {}
            }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            const loader = document.getElementById('loading-overlay');
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                syncData();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
                loader.classList.add('opacity-0');
                setTimeout(() => loader.classList.add('hidden'), 500);
            }
        });

        // --- FORM HANDLERS ---
        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('auth-submit-btn');
            
            btn.disabled = true;
            btn.textContent = 'Processando...';

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                    showToast("Conta criada com sucesso!");
                }
            } catch (err) {
                console.error(err);
                showToast("Erro: Credenciais inválidas.", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = isLoginMode ? 'Entrar' : 'Criar Conta';
            }
        };

        document.getElementById('toggle-auth-mode').onclick = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').textContent = isLoginMode ? 'Aceder ao Diário' : 'Criar Nova Conta';
            document.getElementById('auth-subtitle').textContent = isLoginMode ? 'Introduza as suas credenciais para continuar.' : 'Registe-se para começar a usar o Diário Pro.';
            document.getElementById('auth-submit-btn').textContent = isLoginMode ? 'Entrar' : 'Criar Conta';
            document.getElementById('toggle-auth-mode').textContent = isLoginMode ? 'Não tem conta? Crie uma agora' : 'Já tem conta? Faça login';
        };

        window.handleLogout = async () => {
            if (confirm("Deseja terminar a sessão?")) await signOut(auth);
        };

        // --- FIRESTORE SYNC (Rule 1 & 2) ---
        const syncData = () => {
            if (!user) return;
            const classesRef = collection(db, 'artifacts', appId, 'users', user.uid, 'classes');
            
            onSnapshot(classesRef, (snapshot) => {
                state.classes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                if (state.classes.length === 0) {
                    createInitialClass();
                } else {
                    if (!activeClassId) activeClassId = state.classes[0].id;
                    updateUI();
                }
                
                const loader = document.getElementById('loading-overlay');
                loader.classList.add('opacity-0');
                setTimeout(() => loader.classList.add('hidden'), 500);
            }, (err) => {
                console.error(err);
                showToast("Erro ao sincronizar dados.", "error");
            });
        };

        const createInitialClass = async () => {
            const classRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'classes'));
            await setDoc(classRef, {
                name: "Minha Turma 1",
                createdAt: new Date().toISOString(),
                students: [],
                attendance: {}
            });
            activeClassId = classRef.id;
        };

        // --- APP LOGIC ---
        window.addStudent = async () => {
            const input = document.getElementById('new-student-name');
            const name = input.value.trim();
            if (!name || !activeClassId) return;

            const cls = state.classes.find(c => c.id === activeClassId);
            const news = [...(cls.students || []), { id: crypto.randomUUID(), name }];

            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'classes', activeClassId), { students: news });
            input.value = '';
            showToast("Aluno adicionado!");
        };

        window.removeStudent = async (sid) => {
            if (!confirm("Remover este aluno?")) return;
            const cls = state.classes.find(c => c.id === activeClassId);
            const filtered = cls.students.filter(s => s.id !== sid);
            const att = { ...cls.attendance };
            Object.keys(att).forEach(d => { if (att[d][sid]) delete att[d][sid]; });

            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'classes', activeClassId), { students: filtered, attendance: att });
        };

        window.markStatus = async (sid, status) => {
            const date = document.getElementById('current-date').value;
            const cls = state.classes.find(c => c.id === activeClassId);
            const att = { ...cls.attendance } || {};
            if (!att[date]) att[date] = {};
            
            if (att[date][sid] === status) delete att[date][sid];
            else att[date][sid] = status;

            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'classes', activeClassId), { attendance: att });
        };

        window.markAll = async (status) => {
            const date = document.getElementById('current-date').value;
            const cls = state.classes.find(c => c.id === activeClassId);
            const att = { ...cls.attendance } || {};
            if (!att[date]) att[date] = {};
            cls.students.forEach(s => att[date][s.id] = status);
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'classes', activeClassId), { attendance: att });
        };

        window.addClass = async () => {
            const name = document.getElementById('new-class-name').value.trim();
            if (!name) return;
            const ref = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'classes'));
            await setDoc(ref, { name, createdAt: new Date().toISOString(), students: [], attendance: {} });
            activeClassId = ref.id;
            document.getElementById('new-class-name').value = '';
            document.getElementById('modal-manage-classes').classList.add('hidden');
        };

        window.switchClass = (id) => {
            activeClassId = id;
            document.getElementById('modal-manage-classes').classList.add('hidden');
            updateUI();
        };

        // --- UI ---
        const updateUI = () => {
            const cls = state.classes.find(c => c.id === activeClassId);
            if (!cls) return;

            document.getElementById('active-class-title').textContent = cls.name;
            const date = document.getElementById('current-date').value;
            const daily = cls.attendance?.[date] || {};
            const search = document.getElementById('search-students').value.toLowerCase();
            const filtered = (cls.students || []).filter(s => s.name.toLowerCase().includes(search)).sort((a,b) => a.name.localeCompare(b.name));

            document.getElementById('empty-state').classList.toggle('hidden', filtered.length > 0);
            let stats = { P: 0, F: 0, J: 0 };

            document.getElementById('students-table-body').innerHTML = filtered.map((s, idx) => {
                const st = daily[s.id] || null;
                if (st) stats[st]++;
                return `
                <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/20 transition-all">
                    <td class="px-6 py-4 text-xs font-black text-slate-300 text-center">${idx + 1}</td>
                    <td class="px-6 py-4 font-bold text-slate-700 dark:text-slate-200">${s.name}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="markStatus('${s.id}', 'P')" class="w-9 h-9 rounded-xl border-2 border-present flex items-center justify-center text-xs font-black transition-all ${st === 'P' ? 'bg-present text-white shadow-lg shadow-present/30' : 'text-present hover:bg-present/10'}">P</button>
                            <button onclick="markStatus('${s.id}', 'F')" class="w-9 h-9 rounded-xl border-2 border-absent flex items-center justify-center text-xs font-black transition-all ${st === 'F' ? 'bg-absent text-white shadow-lg shadow-absent/30' : 'text-absent hover:bg-absent/10'}">F</button>
                            <button onclick="markStatus('${s.id}', 'J')" class="w-9 h-9 rounded-xl border-2 border-justified flex items-center justify-center text-xs font-black transition-all ${st === 'J' ? 'bg-justified text-white shadow-lg shadow-justified/30' : 'text-justified hover:bg-justified/10'}">J</button>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right no-print">
                        <button onclick="removeStudent('${s.id}')" class="p-2 text-slate-300 hover:text-red-500 rounded-lg">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </td>
                </tr>`;
            }).join('');

            document.getElementById('stat-p').textContent = stats.P;
            document.getElementById('stat-f').textContent = stats.F;
            document.getElementById('stat-j').textContent = stats.J;

            document.getElementById('classes-list').innerHTML = state.classes.map(c => `
                <div class="flex items-center justify-between p-4 rounded-2xl border-2 cursor-pointer ${c.id === activeClassId ? 'border-brand-500 bg-brand-50 dark:bg-brand-900/10' : 'border-slate-100 dark:border-slate-800'}" onclick="switchClass('${c.id}')">
                    <span class="font-black text-sm">${c.name}</span>
                    <span class="text-[9px] bg-slate-200 dark:bg-slate-700 px-2 py-1 rounded-lg font-black text-slate-500">${c.students?.length || 0} ALUNOS</span>
                </div>
            `).join('');
        };

        window.openCharts = () => {
            const cls = state.classes.find(c => c.id === activeClassId);
            if (!cls) return;
            let total = { P: 0, F: 0, J: 0 };
            Object.values(cls.attendance || {}).forEach(d => Object.values(d).forEach(st => total[st]++));
            document.getElementById('modal-charts').classList.remove('hidden');
            document.getElementById('chart-legend').innerHTML = `<div>PRESENÇA<br>${total.P}</div><div>FALTA<br>${total.F}</div><div>JUSTIF.<br>${total.J}</div>`;
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            if (attendanceChart) attendanceChart.destroy();
            attendanceChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [total.P, total.F, total.J], backgroundColor: ['#22c55e', '#ef4444', '#f59e0b'], borderWidth: 4, borderColor: '#0f172a' }] },
                options: { cutout: '80%', plugins: { legend: { display: false } } }
            });
        };

        const showToast = (msg, type = 'success') => {
            const toast = document.createElement('div');
            toast.className = `px-5 py-3 rounded-2xl shadow-2xl border bg-white dark:bg-slate-900 text-xs font-black ${type === 'success' ? 'border-green-100 text-green-600' : 'border-red-100 text-red-600'}`;
            toast.textContent = msg;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        // --- INIT ---
        window.onload = () => {
            const theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') document.documentElement.classList.add('dark');
            document.getElementById('current-date').valueAsDate = new Date();
            document.getElementById('current-date').onchange = updateUI;
            document.getElementById('search-students').oninput = updateUI;
            document.getElementById('theme-toggle').onclick = () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };
            initAuth();
        };
    </script>
</body>
</html>
